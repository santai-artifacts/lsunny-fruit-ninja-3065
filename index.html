<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/5;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .ui {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }

        .score, .combo {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 10px;
        }

        .lives {
            display: flex;
            gap: 8px;
        }

        .life {
            width: 30px;
            height: 30px;
            background: #ff6b6b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
        }

        .gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .gameOverScreen.active {
            display: flex;
        }

        .gameOverContent {
            text-align: center;
            color: white;
        }

        .gameOverContent h1 {
            font-size: 48px;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .finalScore {
            font-size: 36px;
            margin-bottom: 40px;
            color: #ffd700;
        }

        .restartBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .restartBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        @media (max-width: 600px) {
            .ui {
                flex-wrap: wrap;
                gap: 10px;
            }

            .score, .combo {
                font-size: 18px;
                padding: 8px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="gameCanvas"></canvas>

        <div class="ui">
            <div class="score">Score: <span id="score">0</span></div>
            <div class="combo">Combo: <span id="combo">0</span>x</div>
            <div class="lives" id="lives"></div>
        </div>

        <div class="gameOverScreen" id="gameOverScreen">
            <div class="gameOverContent">
                <h1>GAME OVER</h1>
                <div class="finalScore">Final Score: <span id="finalScore">0</span></div>
                <button class="restartBtn" onclick="location.reload()">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        const game = {
            score: 0,
            combo: 0,
            lives: 3,
            gameOver: false,
            fruits: [],
            particles: [],
            sliceTrail: [],
            lastSpawn: 0,
            spawnRate: 1000,
        };

        const fruits = ['🍎', '🍊', '🍌', '🍇', '🍓', '🍉'];
        const bomb = '💣';

        class Fruit {
            constructor(x, y, vx, vy, emoji) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.emoji = emoji;
                this.radius = 25;
                this.sliced = false;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.3;
            }

            update() {
                this.vy += 0.3;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.radius * 1.6}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.globalAlpha = this.sliced ? 0.5 : 1;
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }

            isOffScreen() {
                return this.y > canvas.height + 50;
            }
        }

        class Particle {
            constructor(x, y, vx, vy, emoji) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.emoji = emoji;
                this.life = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life -= 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        function spawnFruit() {
            const now = Date.now();
            if (now - game.lastSpawn < game.spawnRate) return;

            game.lastSpawn = now;
            const isBomb = Math.random() < 0.15;
            const emoji = isBomb ? bomb : fruits[Math.floor(Math.random() * fruits.length)];

            const x = Math.random() * (canvas.width - 100) + 50;
            const y = canvas.height + 30;
            const vx = (Math.random() - 0.5) * 8;
            const vy = -Math.random() * 12 - 8;

            game.fruits.push(new Fruit(x, y, vx, vy, emoji));
        }

        function distance(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function checkSlice(x, y) {
            for (let fruit of game.fruits) {
                if (fruit.sliced) continue;

                if (distance(x, y, fruit.x, fruit.y) < fruit.radius + 15) {
                    fruit.sliced = true;

                    if (fruit.emoji === bomb) {
                        game.lives--;
                        if (game.lives <= 0) {
                            endGame();
                        }
                        createParticles(fruit.x, fruit.y, '💥', 8);
                    } else {
                        const points = Math.max(10, Math.floor(100 - game.combo * 5));
                        game.score += points + game.combo * 5;
                        game.combo++;
                        if (game.spawnRate > 500) {
                            game.spawnRate -= 10;
                        }
                        createParticles(fruit.x, fruit.y, fruit.emoji, 5);
                    }
                    updateUI();
                }
            }
        }

        function createParticles(x, y, emoji, count) {
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                const speed = 3 + Math.random() * 4;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed - 2;
                game.particles.push(new Particle(x, y, vx, vy, emoji));
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = game.score;
            document.getElementById('combo').textContent = game.combo;

            const livesContainer = document.getElementById('lives');
            livesContainer.innerHTML = '';
            for (let i = 0; i < game.lives; i++) {
                const life = document.createElement('div');
                life.className = 'life';
                life.textContent = '❤️';
                livesContainer.appendChild(life);
            }
        }

        function endGame() {
            game.gameOver = true;
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('gameOverScreen').classList.add('active');
        }

        function update() {
            if (game.gameOver) return;

            spawnFruit();

            for (let i = game.fruits.length - 1; i >= 0; i--) {
                game.fruits[i].update();

                if (game.fruits[i].isOffScreen()) {
                    if (!game.fruits[i].sliced) {
                        game.combo = 0;
                        game.lives--;
                        updateUI();
                        if (game.lives <= 0) {
                            endGame();
                        }
                    }
                    game.fruits.splice(i, 1);
                }
            }

            for (let i = game.particles.length - 1; i >= 0; i--) {
                game.particles[i].update();
                if (game.particles[i].life <= 0) {
                    game.particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            game.fruits.forEach(fruit => fruit.draw());
            game.particles.forEach(particle => particle.draw());
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            checkSlice(x, y);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            for (let touch of e.touches) {
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                checkSlice(x, y);
            }
        }, { passive: false });

        updateUI();
        gameLoop();
    </script>
</body>
</html>
